<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kağan AI - Özel Yapay Zeka</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* Dil Değiştirme Butonu */
        .lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
        }

        .lang-btn {
            background-color: #161b22;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background-color: #238636;
            color: #ffffff;
            border-color: #238636;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .badge {
            background-color: #238636;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h1 {
            color: #58a6ff;
            font-size: 28px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        p {
            color: #8b949e;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .download-btn {
            background-color: #238636;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            display: inline-block;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
        }

        .download-btn:hover {
            background-color: #2ea043;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(35, 134, 54, 0.4);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 12px;
            color: #484f58;
        }
    </style>
</head>
<body>

    <!-- Sağ Üst Dil Seçici -->
    <div class="lang-switch">
        <button class="lang-btn active" onclick="setLanguage('tr')">TR</button>
        <button class="lang-btn" onclick="setLanguage('en')">EN</button>
    </div>

    <div class="card">
        <span class="badge" id="badge">Özel Geliştirilmiş Sürüm</span>
        <h1 id="title">Kağan AI Yapay Zeka</h1>
        <p id="desc">Gelişmiş özel yapay zeka modeline erişmek ve hemen indirmek için aşağıdaki butona tıklayın.</p>
        
        <a href="https://huggingface.co/kaganx/kagan-ai" class="download-btn" id="btn" target="_blank">🚀 Modeli İndir ve Kullan</a>

        <div class="footer-text" id="footer">
            © Kağan AI • Özel Lisanslı Yapay Zeka Altyapısı
        </div>
    </div>

    <script>
        const translations = {
            tr: {
                badge: "Özel Geliştirilmiş Sürüm",
                title: "Kağan AI Yapay Zeka",
                desc: "Gelişmiş özel yapay zeka modeline erişmek ve hemen indirmek için aşağıdaki butona tıklayın.",
                btn: "🚀 Modeli İndir ve Kullan",
                footer: "© Kağan AI • Özel Lisanslı Yapay Zeka Altyapısı"
            },
            en: {
                badge: "Custom Pro Edition",
                title: "Kağan AI Model",
                desc: "Access and download the custom advanced AI model directly using the button below.",
                btn: "🚀 Access & Download Model",
                footer: "© Kağan AI • Private Licensed AI Infrastructure"
            }
        };

        function setLanguage(lang) {
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            if(lang === 'tr') {
                document.querySelectorAll('.lang-btn')[0].classList.add('active');
            } else {
                document.querySelectorAll('.lang-btn')[1].classList.add('active');
            }

            document.getElementById('badge').innerText = translations[lang].badge;
            document.getElementById('title').innerText = translations[lang].title;
            document.getElementById('desc').innerText = translations[lang].desc;
            document.getElementById('btn').innerText = translations[lang].btn;
            document.getElementById('footer').innerText = translations[lang].footer;
        }
    </script>

</body>
</html>
