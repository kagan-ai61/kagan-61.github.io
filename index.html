<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kağan AI - Özel Yapay Zeka</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .badge {
            background-color: #238636;
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h1 {
            color: #58a6ff;
            font-size: 28px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        p {
            color: #8b949e;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .download-btn {
            background-color: #238636;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            display: inline-block;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.3);
        }

        .download-btn:hover {
            background-color: #2ea043;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(35, 134, 54, 0.4);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 12px;
            color: #484f58;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">Özel Yapay Zeka Sürümü</span>
        <h1>Kağan AI Projesi</h1>
        <p>Gelişmiş yapay zeka modeline güvenli erişim sağlayın ve doğrudan indirin.</p>
        
        <!-- Yapay Zeka İndirme Bağlantısı -->
        <a href="https://huggingface.co/kaganx/kagan-ai" class="download-btn" target="_blank">🚀 Model Sayfasına Git ve İndir</a>

        <div class="footer-text">
            Korumalı Depo • Tüm Hakları Saklıdır
        </div>
    </div>

</body>
</html>
